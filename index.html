<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生活雷达</title>
<meta name="theme-color" content="#29473A">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="生活雷达">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* 大地暖色：暖米底、墨绿标题栏、沙色大圆角卡片、棕色与青绿点缀；单一浅色主题 */
:root{
  --bg:#F2EADF;--card:#E7DCCB;--card-hi:#EFE6D8;--line:#D9CBB5;--ink:#29473A;--text:#3B3328;--muted:#7D7060;
  --brown:#7A5233;--teal:#2A9D8F;--teal-soft:#D3E4DC;--rust:#B4532A;--rust-soft:#F0D9C8;--bar:#29473A;--bar-ink:#F2EADF;
  --f-title:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bar)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.6;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
/* 顶栏：不透明，盖住状态栏区域 */
.topbar{position:sticky;top:0;z-index:8;background:var(--bar);color:var(--bar-ink);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px}
.topbar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font-family:var(--f-title);font-size:21px;font-weight:700;margin:0;letter-spacing:.06em}
.topbar .date{font-size:12.5px;opacity:.75;margin-left:10px;font-variant-numeric:tabular-nums}
.topbar .tb-btn{border:1px solid rgba(242,234,223,.35);background:transparent;color:var(--bar-ink);border-radius:999px;padding:4px 14px;font-size:13.5px}
.topbar .tb-btn:disabled{opacity:.5}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.hero{background:var(--card);border-radius:22px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;background:var(--teal);opacity:.12}
.status{font-family:var(--f-title);font-size:20px;font-weight:700;color:var(--ink);line-height:1.45;margin:0;text-wrap:balance;position:relative}
.status em{font-style:normal;color:var(--rust)}
.sub{color:var(--muted);font-size:13px}
.hero .sub{margin:6px 0 0;position:relative}
.notice{background:var(--rust-soft);color:var(--brown);border-radius:14px;padding:10px 14px;font-size:13.5px;margin-top:12px}
section.band{margin-top:26px}
.band-head{display:flex;align-items:baseline;gap:8px;margin:0 4px 10px;font-family:var(--f-title);font-size:16px;font-weight:700;color:var(--ink)}
.band-head .count{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted)}
.band-head button.fold{margin-left:auto;border:0;background:none;color:var(--teal);font-family:var(--f-body);font-size:13.5px;font-weight:400;padding:0}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:20px;padding:16px 18px;min-width:0}
.card h3{font-family:var(--f-title);font-size:16.5px;font-weight:700;color:var(--ink);margin:0 0 4px;line-height:1.5}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 10px;background:var(--rust-soft);color:var(--rust);font-weight:500;margin-bottom:8px}
.row{display:grid;grid-template-columns:4em 1fr;gap:6px 10px;font-size:14.5px;margin:10px 0 0}
.row dt{color:var(--muted);font-size:13px;padding-top:1px}.row dd{margin:0;min-width:0}
.row dd b{color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.chip{font-size:12px;border-radius:999px;padding:1px 9px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.bad{background:var(--rust-soft);color:var(--rust)}.chip.good{background:var(--teal-soft);color:#1E7268}
.lvl{font-weight:700;font-size:12px;border-radius:6px;padding:0 6px;flex:none;line-height:20px;background:var(--bg);color:var(--muted)}
.lvl.A,.lvl.B{background:var(--teal-soft);color:#1E7268}.lvl.C{background:#F1E3C4;color:var(--brown)}.lvl.D{background:var(--rust-soft);color:var(--rust)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 16px;font-size:14px;text-decoration:none;display:inline-block}
.btn.primary{background:var(--ink);color:var(--bg);font-weight:500}
.btn.ghost{background:transparent;color:var(--muted);padding-inline:8px}
.btn:disabled{opacity:.5}
.linkish{border:0;background:none;padding:0 4px;color:var(--teal);font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:16px 18px;background:var(--card-hi);border-radius:20px}
/* 分组列表 */
.group{background:var(--card);border-radius:20px;overflow:hidden}
.item{display:flex;gap:12px;width:100%;text-align:left;border:0;background:none;padding:13px 18px;border-top:1px solid var(--line);align-items:flex-start}
.item:first-child{border-top:0}
.item:active{background:var(--card-hi)}
.item .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:9px;background:var(--brown);opacity:.55}
.item.hi .dot{background:var(--teal);opacity:1}
.item .body{min-width:0;flex:1}
.item .t{color:var(--text);font-size:15px;line-height:1.55}
.item.hi .t{color:var(--ink);font-weight:500}
.item .r{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.5}
.item .when{font-size:12px;color:var(--muted);white-space:nowrap;margin-top:3px;font-variant-numeric:tabular-nums}
label.f{display:block;font-size:13px;color:var(--muted);margin:16px 4px 6px}
textarea,input[type=text],input[type=url]{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card-hi);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
textarea{min-height:150px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--teal)}
/* 底栏 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:180px;border:0;background:none;padding:10px 0 12px;font-size:14px;color:var(--muted);position:relative}
nav.tabs button[aria-current=page]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current=page]::before{content:"";position:absolute;top:6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--teal);transform:translateY(-4px)}
.badge{font-size:11px;color:var(--rust);margin-left:3px;font-weight:700}
/* 详情页 */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .wrap{padding-block:16px 48px}
.sheet h2{font-family:var(--f-title);font-size:21px;font-weight:700;color:var(--ink);line-height:1.5;margin:0 0 4px;text-wrap:balance}
.sheet h4{font-family:var(--f-title);font-size:15px;font-weight:700;color:var(--brown);margin:24px 4px 10px}
.claim{padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}.claim:first-child{border-top:0;padding-top:0}.claim:last-child{padding-bottom:0}
.ctext{display:flex;gap:10px;align-items:flex-start}
.note{color:var(--muted);font-size:13px;margin-top:4px;word-break:break-all;padding-left:34px}
.chain{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:2px solid var(--teal);display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.chain li span{display:inline-block;width:4.5em;color:var(--muted);font-size:12.5px}
.trace{font-size:12px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:2px 12px;word-break:break-all}
.raw{white-space:pre-wrap;font-size:13.5px;background:var(--card-hi);border-radius:16px;padding:12px 14px;max-height:260px;overflow:auto}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:0 4px}
.seg button{border:0;background:var(--card);border-radius:999px;padding:6px 16px;font-size:14px;color:var(--text)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:18px;padding:12px}
.stat b{display:block;font-family:var(--f-title);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:20;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.item,.btn{transition:background .15s}}
</style>
</head>
<body>
<header class="topbar"><div class="in"><div><h1 style="display:inline">生活雷达</h1><span class="date" id="today"></span></div><button class="tb-btn" id="btn-refresh" type="button">刷新</button></div></header>
<div class="wrap">
  <div id="boot" class="notice">正在读取……</div>

  <main id="view-today" hidden>
    <div class="hero"><p class="status" id="status-line"></p><p class="sub" id="status-sub"></p></div>
    <div id="pending"></div>
    <section class="band"><div class="band-head">需要行动 <span class="count" id="c-act"></span></div><div class="list" id="g-act"></div></section>
    <section class="band"><div class="band-head">重要 <span class="count" id="c-hi"></span></div><div id="g-hi"></div></section>
    <section class="band"><div class="band-head">一般 · 知道就行 <span class="count" id="c-lo"></span></div><div id="g-lo"></div></section>
    <section class="band"><div class="band-head">暂不判断 <span class="count" id="c-und"></span><button class="fold" type="button" data-fold="g-und">展开</button></div><div id="g-und" hidden></div></section>
    <section class="band"><div class="band-head">更早的记录 <span class="count" id="c-old"></span><button class="fold" type="button" data-fold="g-old">展开</button></div><div id="g-old" hidden></div></section>
  </main>

  <main id="view-feed" hidden>
    <div class="hero"><p class="status">扔一条信息进来</p><p class="sub">贴正文或链接，点“提交”会打开 GitHub，再点一次 Submit 即可。截图请在 GitHub 页面里直接粘贴到正文。约 1–2 分钟后结果出现在“今日”。</p></div>
    <form id="feed-form">
      <label class="f" for="in-text">正文</label>
      <textarea id="in-text" placeholder="粘贴文字"></textarea>
      <label class="f" for="in-url">链接（可选）</label>
      <input type="url" id="in-url" placeholder="https://">
      <div class="actions"><button class="btn primary" type="submit">提交到 GitHub</button></div>
    </form>
    <section class="band"><div class="band-head">我投喂过的</div><div class="list" id="feed-history"></div></section>
  </main>

  <main id="view-review" hidden>
    <div class="hero"><p class="status">复盘</p><p class="sub">四层打分，用来看清 AI 错在哪一环。到期 7 天后才复盘的记为过期，不计入统计。</p></div>
    <div class="stats" id="stats"></div>
    <p class="sub" id="gate" style="margin-top:8px"></p>
    <section class="band"><div class="band-head">到期待复盘 <span class="count" id="c-due"></span></div><div class="list" id="g-due"></div></section>
    <section class="band"><div class="band-head">未到期 <span class="count" id="c-later"></span><button class="fold" type="button" data-fold="g-later">展开</button></div><div class="list" id="g-later" hidden></div></section>
    <section class="band"><div class="band-head">归因</div><div id="attrib" class="sub"></div></section>
    <section class="band"><div class="band-head">画像 <span class="count" id="p-ver"></span></div><div class="card" id="profile-view"></div></section>
  </main>
</div>

<nav class="tabs" aria-label="主导航">
  <button type="button" data-tab="today" aria-current="page">今日</button>
  <button type="button" data-tab="feed">投喂</button>
  <button type="button" data-tab="review">复盘<span class="badge" id="due-badge"></span></button>
</nav>
<div class="sheet" id="sheet" hidden><header class="topbar"><div class="in"><button class="tb-btn" type="button" id="back">← 返回</button><span class="date" id="sheet-title"></span></div></header><div class="wrap" id="sheet-body"></div></div>

<script>
(() => {
const OWNER = "zxy8125ss", REPO = "life-radar";
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const LABEL = {city:"常住城市",family:"家庭情况",vehicle_type:"车辆类型",monthly_mileage:"月均里程",long_trip:"长途用车",funds:"持仓基金",occupation:"职业",industry:"所在行业",housing:"住房情况",notes:"其他"};
const S = { items: [], reviews: [], profile: null, runs: null, tab: "today" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const z = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ""));
const md = s => { if (!isDate(s)) return esc(s || ""); const d = new Date(s + "T00:00:00"); return (d.getMonth() + 1) + "月" + d.getDate() + "日"; };
const short = iso => { const d = new Date(iso); return isNaN(d) ? "" : (d.getMonth() + 1) + "/" + d.getDate() + " " + z(d.getHours()) + ":" + z(d.getMinutes()); };
const lvl = l => `<span class="lvl ${esc(l || "n")}">${esc(l || "—")}</span>`;
const ls = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
$("today").textContent = today();

/* ---------- 读数据：优先 API（即时），失败退回 Pages 文件 ---------- */
async function getJson(path) {
  try { const r = await fetch(`${API}/contents/${path}?t=${Date.now()}`, { headers: { accept: "application/vnd.github.raw+json" }, cache: "no-store" }); if (r.ok) return await r.json(); } catch (_) {}
  try { const r = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" }); if (r.ok) return await r.json(); } catch (_) {}
  return null;
}
async function load() {
  $("btn-refresh").disabled = true;
  const [items, reviews, profile, runs] = await Promise.all(["data/items.json", "data/reviews.json", "data/profile.json", "data/runs.json"].map(getJson));
  $("btn-refresh").disabled = false;
  if (!items) { $("boot").hidden = false; $("boot").textContent = "读取失败，检查网络后点右上角刷新。"; return; }
  S.items = items.items || []; S.updated = items.updated_at; S.reviews = (reviews && reviews.reviews) || []; S.runs = runs;
  S.profile = ((profile && profile.versions) || []).slice().sort((a, b) => b.version - a.version)[0] || { version: 0, content: {} };
  ls.set("lr-cache", { items, reviews, profile, runs });
  // 已同步的本地待处理提交清掉
  const pend = ls.get("lr-pending", []).filter(p => Date.now() - p.at < 20 * 60e3 && !synced(p));
  ls.set("lr-pending", pend);
  $("boot").hidden = true; render();
}
function synced(p) {
  if (p.type === "feed") return S.items.some(i => i.source === "feed" && new Date(i.created_at).getTime() > p.at - 60e3 && (i.raw_text || "").slice(0, 30) === (p.text || "").slice(0, 30));
  if (p.type === "action") { const it = S.items.find(i => i.id === p.item_id); return it && it.action && it.action.status !== "待办"; }
  if (p.type === "review") return S.reviews.some(r => r.item_id === p.item_id);
  if (p.type === "profile") return S.profile.version > p.base;
  return true;
}
const cached = ls.get("lr-cache", null);
if (cached && cached.items) { S.items = cached.items.items || []; S.updated = cached.items.updated_at; S.reviews = (cached.reviews && cached.reviews.reviews) || []; S.runs = cached.runs; S.profile = ((cached.profile && cached.profile.versions) || []).slice().sort((a, b) => b.version - a.version)[0] || { version: 0, content: {} }; $("boot").hidden = true; }

/* ---------- 提交：打开预填好的 GitHub Issue ---------- */
function submit(type, title, payload, extra) {
  const body = (extra ? extra + "\n\n" : "") + "```lr1\n" + JSON.stringify({ type, ...payload }) + "\n```\n\n<sub>由生活雷达 App 生成，点 Submit 提交即可。</sub>";
  let url = `https://github.com/${OWNER}/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  if (url.length > 7800) {
    try { navigator.clipboard.writeText(body); } catch (_) {}
    url = `https://github.com/${OWNER}/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent("（内容较长，已复制到剪贴板，请粘贴到这里）")}`;
  }
  const pend = ls.get("lr-pending", []); pend.push({ type, at: Date.now(), ...payload, base: S.profile ? S.profile.version : 0 }); ls.set("lr-pending", pend);
  window.open(url, "_blank", "noopener");
  toast("提交后约 1–2 分钟同步，回来点刷新");
  render();
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 3500); }

/* ---------- 导航 ---------- */
function show(tab) {
  S.tab = tab;
  ["today", "feed", "review"].forEach(t => $("view-" + t).hidden = t !== tab);
  document.querySelectorAll("nav.tabs button").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => show(b.dataset.tab));
$("btn-refresh").onclick = load;
document.addEventListener("click", e => {
  const f = e.target.closest("[data-fold]"); if (f) { const el = $(f.dataset.fold); el.hidden = !el.hidden; f.textContent = el.hidden ? "展开" : "收起"; return; }
  const o = e.target.closest("[data-open]"); if (o) { openDetail(o.dataset.open); return; }
  const a = e.target.closest("[data-act]"); if (a) { const it = S.items.find(i => i.id === a.dataset.id); submit("action", `${a.dataset.act}：${it ? (it.action.do).slice(0, 30) : ""}`, { item_id: a.dataset.id, status: a.dataset.act }); return; }
  const r = e.target.closest("[data-review]"); if (r) { openReview(r.dataset.review); return; }
});

/* ---------- 分组 ---------- */
const pendingOf = (type, id) => ls.get("lr-pending", []).some(p => p.type === type && p.item_id === id);
function groups() {
  const since = addDays(today(), -7);
  const g = { act: [], hi: [], lo: [], und: [], old: [] };
  for (const it of S.items) {
    if (it.action && it.action.status === "待办" && !pendingOf("action", it.id)) { g.act.push(it); continue; }
    const recent = String(it.created_at).slice(0, 10) >= since || (it.published_at && it.published_at >= since);
    if (!recent) { if ((it.relevance || 0) > 0) g.old.push(it); continue; }
    if (it.status === "undetermined") g.und.push(it);
    else if ((it.relevance || 0) >= 2) g.hi.push(it);
    else if ((it.relevance || 0) === 1) g.lo.push(it);
  }
  g.act.sort((a, b) => String(a.action.review_on).localeCompare(String(b.action.review_on)));
  g.hi.sort((a, b) => b.relevance - a.relevance || String(b.created_at).localeCompare(String(a.created_at)));
  return g;
}

/* ---------- 渲染 ---------- */
function render() { renderToday(); renderFeed(); renderReview(); }
function renderToday() {
  $("view-today").hidden = S.tab !== "today";
  const g = groups(), know = g.hi.length + g.lo.length;
  $("status-line").innerHTML = g.act.length ? `${know + g.act.length} 件事值得你关注，<em>${g.act.length} 件需要行动</em>` : (know ? `${know} 件事值得知道，今天没有需要你行动的事情` : "今天没有需要你行动的事情");
  const last = S.runs && S.runs.log && S.runs.log[0];
  $("status-sub").textContent = (S.updated ? `数据更新于 ${short(S.updated)}` : "") + (last && !last.ok ? `。今早自动更新失败：${last.note}` : "") + (last && last.ok && last.note ? `。${last.note}` : "");
  const pend = ls.get("lr-pending", []);
  $("pending").innerHTML = pend.length ? `<div class="notice">${pend.length} 条提交等待同步。在 GitHub 点了 Submit 之后约 1–2 分钟，点右上角刷新。</div>` : "";
  $("c-act").textContent = g.act.length || "";
  $("g-act").innerHTML = g.act.length ? g.act.slice(0, 3).map(it => `
    <article class="card"><span class="tag">需要行动</span><h3>${esc(it.one_liner || it.title)}</h3>
      <dl class="row"><dt>为什么</dt><dd>${esc(it.relevance_reason)}</dd>
      <dt>现在做</dt><dd><b>${esc(it.action.do)}</b><br><span class="sub">触发条件：${esc(it.action.trigger)}</span></dd>
      <dt>得失</dt><dd>${esc(it.action.basis)}</dd>
      <dt>复盘</dt><dd>${md(it.action.review_on)}<span class="sub">　置信度 ${esc(it.action.confidence)}</span></dd></dl>
      <div class="actions"><button class="btn" type="button" data-act="已执行" data-id="${esc(it.id)}">已执行</button><button class="btn ghost" type="button" data-act="忽略" data-id="${esc(it.id)}">不值得，忽略</button><button class="linkish" type="button" data-open="${esc(it.id)}">看依据</button></div>
    </article>`).join("") : `<div class="empty">今天没有需要你行动的事情。</div>`;
  $("c-hi").textContent = g.hi.length || ""; $("c-lo").textContent = g.lo.length || "";
  $("g-hi").innerHTML = g.hi.length ? group(g.hi.map(it => row(it, { hi: true, sub: it.relevance_reason }))) : `<div class="empty">最近 7 天没有重要的事。</div>`;
  $("g-lo").innerHTML = g.lo.length ? group(g.lo.map(it => row(it, {}))) : `<div class="empty">最近 7 天没有。</div>`;
  $("c-und").textContent = g.und.length || "";
  $("g-und").innerHTML = g.und.length ? group(g.und.map(it => row(it, { sub: "缺：" + (it.undetermined && (it.undetermined.missing || it.undetermined.reason) || "") }))) : `<div class="empty">没有。</div>`;
  $("c-old").textContent = g.old.length || "";
  $("g-old").innerHTML = g.old.length ? group(g.old.slice(0, 60).map(it => row(it, { when: md(String(it.created_at).slice(0, 10)) }))) : `<div class="empty">没有。</div>`;
}
const group = rows => `<div class="group">${rows.join("")}</div>`;
function row(it, o) {
  const attr = o.review ? `data-review="${esc(it.id)}"` : `data-open="${esc(it.id)}"`;
  return `<button class="item${o.hi ? " hi" : ""}" type="button" ${attr}><span class="dot"></span><span class="body"><div class="t">${esc(it.one_liner || it.title)}</div>${o.sub ? `<div class="r">${esc(o.sub)}</div>` : ""}</span>${o.when ? `<span class="when">${o.when}</span>` : ""}</button>`;
}

function renderFeed() {
  const rows = S.items.filter(i => i.source === "feed").slice(0, 20);
  const pend = ls.get("lr-pending", []).filter(p => p.type === "feed");
  const tagOf = it => it.status === "undetermined" ? "暂不判断" : it.action ? "需要行动" : it.relevance >= 2 ? "重要" : it.relevance === 1 ? "知道就行" : "与你无关";
  const pr = pend.map(p => `<div class="item"><span class="dot"></span><span class="body"><div class="t">${esc((p.text || p.url || "截图").slice(0, 40))}</div><div class="r">等待处理</div></span></div>`);
  $("feed-history").innerHTML = (pr.length || rows.length) ? group(pr.concat(rows.map(it => row(it, { sub: tagOf(it), when: md(String(it.created_at).slice(0, 10)) })))) : `<div class="empty">还没有投喂过。</div>`;
}
$("feed-form").onsubmit = e => {
  e.preventDefault();
  const text = $("in-text").value.trim(), url = $("in-url").value.trim();
  submit("feed", "投喂：" + (text || url || "截图").replace(/\s+/g, " ").slice(0, 30), { text, url }, text || url ? "" : "（在这里粘贴截图）");
  $("in-text").value = ""; $("in-url").value = "";
};
// 系统分享进来（安卓）
(() => { const q = new URLSearchParams(location.search); const t = [q.get("title"), q.get("text")].filter(Boolean).join("\n"), u = q.get("url"); if (t || u) { $("in-text").value = t; $("in-url").value = u || ""; S.tab = "feed"; history.replaceState(null, "", location.pathname); } })();

/* ---------- 详情 ---------- */
function openDetail(id) {
  const it = S.items.find(i => i.id === id); if (!it) return;
  const rv = S.reviews.find(r => r.item_id === id);
  let h = `<h2>${esc(it.one_liner || it.title)}</h2>`;
  h += `<h4>为什么与你有关</h4><p style="margin:0">${esc(it.relevance_reason || "—")}</p><div class="meta"><span class="chip">相关度 ${esc(it.relevance)}</span>${(it.profile_refs || []).map(k => `<span class="chip">画像 · ${esc(LABEL[k] || k)}</span>`).join("")}</div>`;
  h += `<h4>事实核查</h4><div class="card">${(it.claims || []).map(c => `<div class="claim"><div class="ctext">${lvl(c.kind === "事实" ? c.level : null)}<span><span class="chip">${esc(c.kind)}</span> ${esc(c.text)}</span></div>${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}${(c.evidence || []).map(e => `<div class="note">${esc(e.stance || "")} · ${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.publisher || e.url)}</a>` : esc(e.publisher)}${e.published_at ? " · " + esc(e.published_at) : ""}${e.note ? " · " + esc(e.note) : ""}</div>`).join("")}</div>`).join("") || `<span class="sub">没有拆出声明。</span>`}</div>
    <div class="sub" style="margin-top:6px">来源类型：${esc(it.source_type || "不明")}${it.published_at ? " · 发布于 " + esc(it.published_at) : ""}${it.url ? ` · <a href="${esc(it.url)}" target="_blank" rel="noopener">原文</a>` : ""}</div>`;
  if (it.status === "undetermined") h += `<h4>暂不判断</h4><div class="card"><b>${esc(it.undetermined && it.undetermined.reason)}</b><div class="sub">还缺：${esc(it.undetermined && it.undetermined.missing)}</div></div>`;
  else {
    h += `<h4>影响分析</h4>` + ((it.impacts || []).length ? it.impacts.map(i => `<div class="card" style="margin-bottom:12px"><div class="meta" style="margin-top:0"><b style="color:var(--ink)">${esc(i.dimension)}</b><span class="chip ${i.direction === "利空" ? "bad" : i.direction === "利好" ? "good" : ""}">${esc(i.direction)}</span><span class="chip">强度 ${esc(i.strength)}</span><span class="chip">${esc(i.horizon)}</span><span class="chip">置信度 ${esc(i.confidence)}</span></div>
      <ol class="chain"><li><span>事实</span>${esc(i.path && i.path.fact)}</li><li><span>直接影响</span>${esc(i.path && i.path.direct)}</li><li><span>中间变量</span>${esc(i.path && i.path.intermediate)}</li><li><span>对你</span>${esc(i.path && i.path.user_effect)}</li></ol>
      <div class="sub" style="margin-top:6px">依据声明 ${(i.based_on || []).map(n => "#" + (Number(n) + 1)).join("、")}</div></div>`).join("") : `<div class="empty">没有证据完整的影响路径，不输出影响。</div>`);
    h += `<h4>是否需要行动</h4>` + (it.action ? `<div class="card"><dl class="row" style="margin-top:0"><dt>动作</dt><dd><b>${esc(it.action.do)}</b></dd><dt>触发条件</dt><dd>${esc(it.action.trigger)}</dd><dt>依据得失</dt><dd>${esc(it.action.basis)}</dd><dt>置信度</dt><dd>${esc(it.action.confidence)}</dd><dt>复盘</dt><dd>${md(it.action.review_on)}</dd><dt>状态</dt><dd>${esc(it.action.status)}</dd></dl></div>` : `<div class="card">暂无需行动。</div>`);
  }
  if (rv) h += `<h4>复盘结果</h4><div class="card sub">事实 ${esc(rv.fact_result)} · 影响 ${esc(rv.impact_result)} · 建议 ${esc(rv.action_result)} · ${esc(rv.rating)}${rv.attribution ? "<br>归因：" + esc(rv.attribution) : ""}${rv.note ? "<br>" + esc(rv.note) : ""}</div>`;
  else h += `<div class="actions" style="margin-top:16px"><button class="btn" type="button" data-review="${esc(it.id)}">复盘这条</button></div>`;
  if (it.raw_text) h += `<h4>原始信息</h4><div class="raw">${esc(it.raw_text)}</div>`;
  if (it.issue) h += `<p class="sub"><a href="https://github.com/${OWNER}/${REPO}/issues/${it.issue}" target="_blank" rel="noopener">投喂记录 #${it.issue}</a></p>`;
  const t = it.trace || {};
  h += `<h4>追溯</h4><div class="trace"><span>核查模型</span><span>${esc(t.verify_model)}</span><span>分析模型</span><span>${esc(t.analyze_model)}</span><span>Prompt</span><span>${esc(t.prompt_version)}</span><span>画像</span><span>v${esc(t.profile_version)}</span><span>时间</span><span>${esc(t.analysis_time)}</span>${(it.validation_notes || []).length ? `<span>校验</span><span>${esc(it.validation_notes.join("；"))}</span>` : ""}</div>`;
  $("sheet-body").innerHTML = h; $("sheet").hidden = false; $("sheet").scrollTop = 0;
  $("back").onclick = () => $("sheet").hidden = true;
}

/* ---------- 复盘 ---------- */
function due() {
  const t = today(), out = { due: [], later: [] };
  for (const it of S.items) {
    if (S.reviews.some(r => r.item_id === it.id) || pendingOf("review", it.id)) continue;
    if (!it.action && (it.relevance || 0) < 2) continue;
    if (it.action && ["已降级"].includes(it.action.status)) continue;
    const d = it.action && isDate(it.action.review_on) ? it.action.review_on : addDays(String(it.created_at).slice(0, 10), 14);
    (d <= t ? out.due : out.later).push({ it, d, late: d < addDays(t, -7) });
  }
  out.due.sort((a, b) => a.d.localeCompare(b.d)); out.later.sort((a, b) => a.d.localeCompare(b.d));
  return out;
}
const ATTR = r => r.fact_result === "错误" ? "事实找错了" : r.impact_result === "错误" ? "推理错了" : (r.impact_result === "正确" && r.action_result === "没用") ? "建议没用" : (r.impact_result === "正确" && r.action_result === "未执行") ? "建议有效但没执行" : "";
function renderReview() {
  const d = due();
  $("due-badge").textContent = d.due.length || "";
  $("c-due").textContent = d.due.length || ""; $("c-later").textContent = d.later.length || "";
  const rr = x => row(x.it, { review: true, sub: x.late ? "已过期，不计入统计" : "", when: md(x.d) });
  $("g-due").innerHTML = d.due.length ? group(d.due.map(rr)) : `<div class="empty">没有到期的复盘。</div>`;
  $("g-later").innerHTML = d.later.length ? group(d.later.map(rr)) : `<div class="empty">没有。</div>`;
  const rs = S.reviews.filter(r => !r.late), pct = (n, m) => m ? Math.round(n / m * 100) + "%" : "—";
  const imp = rs.filter(r => r.impact_result !== "无法验证");
  $("stats").innerHTML = [[rs.length + "/20", "已复盘"], [pct(rs.filter(r => r.fact_result === "正确").length, rs.length), "事实正确率"], [pct(imp.filter(r => r.impact_result === "正确").length, imp.length), "影响正确率"], [pct(rs.filter(r => r.rating !== "不值得").length, rs.length), "值得 + 一般"]].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
  $("gate").textContent = "进入 V0.2 的门槛：用满 4 周、复盘 ≥ 20 条、事实正确率 ≥ 90%、影响正确率 ≥ 70%、值得 + 一般 ≥ 70%。";
  const cnt = {}; rs.forEach(r => { if (r.attribution) cnt[r.attribution] = (cnt[r.attribution] || 0) + 1; });
  $("attrib").textContent = Object.keys(cnt).length ? Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${v} 次`).join("　") : "还没有可归因的复盘。";
  const p = S.profile || { version: 0, content: {} };
  $("p-ver").textContent = "v" + p.version;
  const missing = Object.keys(LABEL).filter(k => !p.content[k] && k !== "notes");
  $("profile-view").innerHTML = `<dl class="row" style="margin-top:0">${Object.entries(p.content).map(([k, v]) => `<dt>${esc(LABEL[k] || k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>${missing.length ? `<p class="sub">还没填：${missing.map(k => LABEL[k]).join("、")}。没填的方面会被判为“画像不足”。</p>` : ""}<div class="actions"><button class="btn" type="button" id="edit-profile">修改画像</button></div>`;
  $("edit-profile").onclick = editProfile;
}
function openReview(id) {
  const it = S.items.find(i => i.id === id); if (!it) return;
  const st = { fact_result: "正确", impact_result: "无法验证", action_result: it.action ? (it.action.status === "已执行" ? "有用" : "未执行") : "不适用", rating: "一般" };
  const seg = (k, o) => `<div class="seg" data-k="${k}">${o.map(x => `<button type="button" aria-pressed="${st[k] === x}">${x}</button>`).join("")}</div>`;
  const dd = due(), x = dd.due.concat(dd.later).find(y => y.it.id === id);
  $("sheet-body").innerHTML = `<h2>${esc(it.one_liner || it.title)}</h2>
    ${it.action ? `<div class="sub">建议：${esc(it.action.do)}（${esc(it.action.status)}）</div>` : `<div class="sub">这条没有行动建议。</div>`}
    <h4>事实判断：核查结论对吗？</h4>${seg("fact_result", ["正确", "错误"])}
    <h4>影响判断：推理对吗？</h4>${seg("impact_result", ["正确", "错误", "无法验证"])}
    <h4>行动建议：帮到你了吗？</h4>${seg("action_result", ["有用", "没用", "未执行", "不适用"])}
    <h4>值得打扰你吗？</h4>${seg("rating", ["值得", "一般", "不值得"])}
    <label class="f" for="r-note">备注（可选，会用来调整以后的判断）</label><textarea id="r-note" style="min-height:72px"></textarea>
    <p class="sub" id="r-attr"></p><div class="actions"><button class="btn primary" type="button" id="r-save">提交复盘</button></div>`;
  $("sheet").hidden = false; $("sheet").scrollTop = 0;
  const showAttr = () => { const t = ATTR(st); $("r-attr").textContent = t ? "归因：" + t : ""; }; showAttr();
  $("sheet-body").querySelectorAll(".seg").forEach(s => s.onclick = e => { const b = e.target.closest("button"); if (!b) return; st[s.dataset.k] = b.textContent; s.querySelectorAll("button").forEach(y => y.setAttribute("aria-pressed", y === b)); showAttr(); });
  $("back").onclick = () => $("sheet").hidden = true;
  $("r-save").onclick = () => { submit("review", "复盘：" + (it.one_liner || it.title).slice(0, 30), { item_id: id, ...st, note: $("r-note").value.trim(), late: !!(x && x.late) }); $("sheet").hidden = true; };
}
function editProfile() {
  const c = (S.profile && S.profile.content) || {};
  $("sheet-body").innerHTML = `<h2>修改画像</h2><p class="sub">保存后生成新版本，旧判断仍记着当时用的版本。</p>` +
    Object.entries(LABEL).map(([k, l]) => `<label class="f" for="p-${k}">${l}</label><input type="text" id="p-${k}" value="${esc(c[k])}">`).join("") +
    `<div class="actions" style="margin-top:16px"><button class="btn primary" type="button" id="p-save">保存</button></div>`;
  $("sheet").hidden = false; $("sheet").scrollTop = 0;
  $("back").onclick = () => $("sheet").hidden = true;
  $("p-save").onclick = () => { const content = {}; Object.keys(LABEL).forEach(k => { const v = $("p-" + k).value.trim(); if (v) content[k] = v; }); submit("profile", "画像：修改", { content }); $("sheet").hidden = true; };
}

if (S.items.length) render();
show(S.tab);
load();
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
